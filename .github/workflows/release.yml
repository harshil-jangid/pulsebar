name: Release

# Tag push (v1.2.3) → test, build, ad-hoc sign, DMG + zip, publish a GitHub Release.
# Manual run (workflow_dispatch) → same build, uploaded as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -nE 's/^ *MARKETING_VERSION: "(.*)"/\1/p' project.yml)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != project version v$VERSION"; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild test -project PulseBar.xcodeproj -scheme PulseBar -destination 'platform=macOS' | tail -20

      - name: Build, sign (ad hoc), zip
        run: ./scripts/build-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PulseBar
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/*.dmg build/release/*.zip build/release/*.sha256 \
            --title "PulseBar $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
